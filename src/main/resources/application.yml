spring:
  application:
    name: shop-advanced
  # 애플리케이션 DB: H2 메모리 DB, MSSQL 호환 모드. 실행(테스트 컨텍스트)마다 따로 만든다.
  # 사람·AI가 SQL을 실행해 보는 개발 DB는 별도 파일 DB다 (./gradlew dbReset, node scripts/db.mjs).
  datasource:
    url: jdbc:h2:mem:shop-${random.uuid};MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      # 개발 DB는 시작할 때마다 schema.sql -> data.sql 순서로 새로 만든다.
      # 운영 DB에는 자동 반영되지 않는다 (.claude/rules/database.md 참고).
      mode: always
      encoding: UTF-8

mybatis:
  # 매퍼 XML 위치 (src/main/resources/mapper/<기능>/XxxMapper.xml)
  mapper-locations: classpath:mapper/**/*.xml

shop:
  # 서버 이름 (배치 이력에 기록). 운영 서버마다 다르다
  server-name: local
  scheduling:
    # 운영에서는 배치 서버 한 대에서만 true로 두고 나머지 서버는 false로 둔다 (배치 중복 실행 방지). 테스트에서는 false로 끈다
    enabled: true

logging:
  level:
    com.example.shop: INFO
