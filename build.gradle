plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '1.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 린트: 위반이 하나라도 있으면 빌드 실패
checkstyle {
    toolVersion = '10.24.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
}

// 린트 대상은 운영 코드(src/main)만
tasks.named('checkstyleTest') {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// 실습 도구 (tools/src). DB 실행기·DB 초기화·SQL 렌더러.
// 수강생 PC의 JDK 17 이상에서 돌도록 release 17 로 컴파일한다.
// ---------------------------------------------------------------------------
sourceSets {
    tools {
        java { srcDirs = ['tools/src'] }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('compileToolsJava') {
    options.release = 17
}

tasks.named('checkstyleTools') {
    enabled = false
}

def toolsJar = tasks.register('toolsJar', Jar) {
    archiveFileName = 'shop-tools.jar'
    destinationDirectory = layout.buildDirectory.dir('tools')
    from sourceSets.tools.output
}

// node scripts/db.mjs 가 쓰는 실행기와 H2 드라이버를 .local/lib 에 둔다
def dbTools = tasks.register('dbTools', Sync) {
    group = 'shop'
    description = 'DB 도구(DbCli)와 H2 드라이버를 .local/lib 에 준비한다'
    from toolsJar
    from(configurations.runtimeClasspath) { include 'h2-*.jar' }
    into layout.projectDirectory.dir('.local/lib')
}

// 개발 DB·운영 흉내 DB를 schema.sql·data.sql 로 다시 만든다. -Pperf: 개발 DB에 대량 데이터 추가
tasks.register('dbReset', JavaExec) {
    group = 'shop'
    description = '개발 DB(.local/db/dev)와 운영 흉내 DB(.local/db/prod)를 다시 만든다'
    dependsOn dbTools
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'shoptools.DbReset'
    workingDir = projectDir
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    args = project.hasProperty('perf') ? ['--perf'] : []
}

// node scripts/render-sql.mjs 가 부른다
tasks.register('renderSql', JavaExec) {
    group = 'shop'
    description = '매퍼 XML과 파라미터 JSON으로 실제 SQL을 렌더링한다 (node scripts/render-sql.mjs)'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'shoptools.SqlRender'
    workingDir = projectDir
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    ignoreExitValue = true
    args = project.hasProperty('renderRequest') ? ['--request', project.property('renderRequest')] : []
}
